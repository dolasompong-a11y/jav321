<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>JAVDB Gallery Hub - Pro Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { primary: '#e74c3c' } }
            }
        }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
        body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        .gallery-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        @media (hover: hover) {
            .gallery-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        }
        .dark body { background-color: #111827; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        .modal-mobile-scroll { -webkit-overflow-scrolling: touch; }
        
        /* สไตล์พิเศษสำหรับระบบ Split View */
        body.split-active { overflow: hidden; }
        .split-wrapper { display: flex; height: calc(100vh - 100px); width: 100%; overflow: hidden; }
        .split-left { flex-grow: 1; overflow-y: auto; padding-bottom: 2rem; }
        .split-resizer { width: 6px; cursor: col-resize; background-color: #e5e7eb; z-index: 30; transition: background-color 0.2s; }
        .dark .split-resizer { background-color: #374151; }
        .split-resizer:hover, .split-resizer:active { background-color: #e74c3c; }
        .split-right { display: flex; flex-direction: column; overflow-y: auto; background-color: white; border-left: 1px solid #e5e7eb; }
        .dark .split-right { background-color: #1f2937; border-color: #374151; }
    </style>
</head>
<body class="bg-gray-100 transition-colors duration-200">

    <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm transition-colors duration-200 dark:bg-gray-800 dark:border-gray-700" id="main-header">

    <!-- Core Scripts & Logic -->
    <script>
        let currentUrl = "https://javdb.com/";
        let currentPage = 1;
        const TARGET_URL = 'https://javdb.com/';
        let currentImages = [];
        
        let activeMainTab = 'home'; 
        let favoriteList = [];      
        let bookmarkList = [];
        
        let gasEndpoint = localStorage.getItem('gas_url') || 'https://script.google.com/macros/s/AKfycbzPyhBDogJv42rqdWfZG5sjroghsWZwhHjz1xAxN1UpoIyWl5XkE8vsqt2ryvCOoga8/exec';
        let slideshowInterval = null;
        let slideshowActiveIndex = 0;
        let slideshowSpeed = 3000;

        let historyStack = [currentUrl]; 
        let historyIndex = 0;            
        let isNavigatingHistory = false; 

        let uiMode = localStorage.getItem('jav_ui_mode') || 'classic';
        let isDragging = false;
        let savedSplitWidth = localStorage.getItem('jav_split_width') || '40%';

        function escapeQuotes(str) {
            return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        
        function showToast(msg, type) {
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        function initUIMode() {
            if (uiMode === 'split' && window.innerWidth >= 768) {
                document.body.classList.add('split-active');
                document.getElementById('layout-wrapper').className = "split-wrapper transition-all duration-200 ease-in-out";
                document.getElementById('left-pane').className = "split-left transition-all duration-200 ease-in-out";
                document.getElementById('pane-resizer').classList.remove('hidden');
                document.getElementById('pane-resizer').classList.add('flex');
                document.getElementById('left-pane').style.width = '100%';
            } else {
                uiMode = 'classic';
                document.body.classList.remove('split-active');
                document.getElementById('layout-wrapper').className = "w-full";
                document.getElementById('left-pane').className = "w-full transition-all duration-200 ease-in-out";
                document.getElementById('left-pane').style.width = '100%';
                document.getElementById('pane-resizer').classList.add('hidden');
                document.getElementById('right-pane').classList.add('hidden');
            }
        }

        function toggleUIMode() {
            if (window.innerWidth < 768) return;
            uiMode = uiMode === 'classic' ? 'split' : 'classic';
            localStorage.setItem('jav_ui_mode', uiMode);
            closeModal();
            initUIMode();
        }

        function updateDOMText(baseId, text) {
            const m = document.getElementById(baseId);
            const s = document.getElementById('s-' + baseId);
            if(m) m.innerText = text;
            if(s) s.innerText = text;
        }
        function updateDOMHTML(baseId, html) {
            const m = document.getElementById(baseId);
            const s = document.getElementById('s-' + baseId);
            if(m) m.innerHTML = html;
            if(s) s.innerHTML = html;
        }

        function resolveUrl(path, base = TARGET_URL) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            if (path.startsWith('//')) return 'https:' + path;
            let origin = TARGET_URL.replace(/\/$/, '');
            try { if (base) origin = new URL(base).origin; } catch(e) {}
            if (path.startsWith('/')) return origin + path;
            return origin + '/' + path;
        }

        async function fetchHtml(url) {
            const targetUrl = url.split('#')[0];
            const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
            const res = await fetch(proxy);
            if (!res.ok) throw new Error('Proxy HTTP Error');
            return await res.text();
        }

        function getRobustImgTag(url, classNames) {
            if (!url) return `<div class="${classNames} bg-gray-300 flex items-center justify-center text-xs">No Image</div>`;
            return `<img src="${url}" class="${classNames}" loading="lazy" decoding="async">`;
        }

        async function loadPage(url) {
            if (!isNavigatingHistory) {
                historyStack = historyStack.slice(0, historyIndex + 1);
                historyStack.push(url);
                historyIndex = historyStack.length - 1;
            }
            currentUrl = url;
            document.getElementById('display-active-url').innerText = url;
            document.getElementById('display-active-url').href = url;

            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '<div class="col-span-full py-20 text-center dark:text-white">Loading JavDB...</div>';

            try {
                const html = await fetchHtml(url);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const items = [];
                const seen = new Set();

                // ปรับให้สแกนหน้าแรกและหมวดหมู่ของ JavDB (รองรับรูปแบบ grid-item)
                doc.querySelectorAll('.grid-item a').forEach(a => {
                    const img = a.querySelector('img');
                    if (!img) return;
                    
                    let src = resolveUrl(img.getAttribute('src') || img.getAttribute('data-src'), url);
                    let title = a.getAttribute('title') || img.getAttribute('alt') || a.innerText.trim();
                    let href = resolveUrl(a.getAttribute('href'), url);
                    
                    let id = '';
                    const strong = a.querySelector('.video-title strong');
                    if (strong) id = strong.innerText.trim();
                    else {
                        const idMatch = title.match(/([a-zA-Z]{2,8}-?\d{2,6})/i);
                        if (idMatch) id = idMatch[1].toUpperCase();
                    }

                    if (id && !seen.has(id) && href.includes('/v/')) {
                        seen.add(id);
                        items.push({ id, title, thumb: src, url: href });
                    }
                });

                if(items.length === 0) throw new Error("No items found");
                renderGrid(items);
            } catch (e) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">Error loading data.</div>`;
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = items.map(item => `
                <div class="gallery-card bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm relative flex flex-col justify-between">
                    <div onclick="handleCardClick('${escapeQuotes(item.id)}', '${escapeQuotes(item.url)}', '${escapeQuotes(item.thumb)}', '${escapeQuotes(item.title)}')">
                        ${getRobustImgTag(item.thumb, "w-full h-auto object-cover")}
                        <div class="p-2 text-xs font-bold text-center">${escapeQuotes(item.id)}</div>
                    </div>
                </div>
            `).join('');
        }

        function handleCardClick(id, url, thumb, title) {
            openModal(id, url, thumb, title);
        }

        async function openModal(id, url, thumbUrl, title) {
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            updateDOMText('m-id', id);
            updateDOMText('m-title', title || id);
            
            try {
                const html = await fetchHtml(url);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                
                // ดึงภาพปก (Cover)
                let coverSrc = thumbUrl;
                const coverImg = doc.querySelector('.video-cover');
                if (coverImg) coverSrc = resolveUrl(coverImg.getAttribute('src'), url);
                
                // ดึงภาพแกลเลอรี (Gallery) พร้อมต่อท้ายด้วย #gallery-1, #gallery-2 ตามโครงสร้างใหม่
                const previewImages = Array.from(doc.querySelectorAll('.preview-images a')).map((a, index) => {
                    let fullImg = resolveUrl(a.getAttribute('href'), url);
                    return `${fullImg}#gallery-${index + 1}`; // นำไปใช้ตามแพทเทิร์นเว็บใหม่
                });

                currentImages = [coverSrc, ...previewImages].filter(Boolean);
                
                updateDOMHTML('m-count', `<strong><i class="fas fa-images"></i> จำนวนรูป:</strong> ${currentImages.length}`);
                
                renderModalImages(currentImages, id, title);
            } catch(e) {
                renderModalImages([thumbUrl], id, title);
            }
        }

        function renderModalImages(images, id, title) {
            const html = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                    ${images.map((src, i) => `
                        <div class="rounded-lg overflow-hidden border border-gray-300">
                            ${getRobustImgTag(src, `w-full h-auto object-contain ${i === 0 ? 'col-span-2' : ''}`)}
                            <div class="p-1 text-xs text-center text-gray-500 break-all">${src.split('#')[1] || 'Cover'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            updateDOMHTML('modal-images', html);
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            document.body.style.overflow = 'auto'; 
        }

        function closeFullImgModal() {
            document.getElementById('full-img-modal').classList.add('hidden');
            document.getElementById('full-img-modal').classList.remove('flex');
            if(slideshowInterval) clearInterval(slideshowInterval);
        }

        function openConfigModal() {
            document.getElementById('gas-url-input').value = gasEndpoint;
            document.getElementById('config-modal').classList.remove('hidden');
            document.getElementById('config-modal').classList.add('flex');
        }

        function closeConfigModal() {
            document.getElementById('config-modal').classList.add('hidden');
            document.getElementById('config-modal').classList.remove('flex');
        }

        function saveConfig() {
            const newUrl = document.getElementById('gas-url-input').value.trim();
            gasEndpoint = newUrl;
            localStorage.setItem('gas_url', newUrl);
            closeConfigModal();
            showToast('บันทึกการตั้งค่า Cloud เรียบร้อย', 'success');
            // Refresh config logic can go here if needed
        }

        // Stubs for remaining interactive buttons
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        function clearHistory() { showToast('ล้างประวัติเรียบร้อย', 'success'); }
        function toggleCurrentPageBookmark() { showToast('บันทึกหน้าปัจจุบันแล้ว', 'success'); }
        function navigateHistoryBack() {}
        function navigateHistoryForward() {}
        function switchMainTab(tab) { activeMainTab = tab; showToast('สลับเป็นแท็บ: ' + tab, 'success'); }
        function filterFavorites() {}
        function navPage(dir) {}
        function closeSplitPane() {
            document.getElementById('right-pane').classList.add('hidden');
            document.body.classList.remove('split-active');
        }
        function toggleSlideshow() {}
        function prevFullImg() {}
        function nextFullImg() {}

        function goHome() { loadPage(TARGET_URL); }
        function loadLatest() { loadPage(TARGET_URL); }
        function toggleBookmarkPanel() { /* Toggle Logic here */ }
        function changeGridSize(size) { /* Grid resize Logic here */ }

        // --- 🚀 เติมฟังก์ชันที่ถูกตัดออกให้สมบูรณ์ ---
        async function fetchBlobRacing(url) {
            // Basic blob fetch fallback
            const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            return await res.blob();
        }

        async function downloadAllIndividuallyModal() {
            if (!currentImages.length) return;
            const btn = document.getElementById('btn-dl-all-modal');
            const idEl = document.getElementById('m-id');
            const movieId = idEl ? idEl.innerText.trim() : 'Unknown';
            const originalText = btn ? btn.innerHTML : '';
            
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> เตรียมดาวน์โหลด...`;
            }
            
            try {
                let completed = 0;
                for (let i = 0; i < currentImages.length; i++) {
                    const imgUrl = currentImages[i].split('#')[0]; // ตัด Hash ออกตอนโหลดจริง
                    if (btn) btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> กำลังโหลด (${completed + 1}/${currentImages.length})`;
                    
                    try {
                        const blob = await fetchBlobRacing(imgUrl);
                        const filename = i === 0 ? `cover_${movieId}.jpg` : `scene_${movieId}_${i}.jpg`;
                        
                        const objUrl = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = objUrl;
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        setTimeout(() => URL.revokeObjectURL(objUrl), 100);
                        completed++;
                    } catch (err) {
                        console.warn(`Failed downloading image at index ${i}:`, err);
                    }
                    
                    await new Promise(r => setTimeout(r, 220)); 
                }
                
                if (btn) btn.innerHTML = `<i class="fas fa-check-circle mr-1"></i> โหลดเสร็จสิ้น!`;
                showToast(`โหลดรูปภาพของเรื่อง ${movieId} เสร็จสมบูรณ์`, "success");
            } catch(e) {
                if (btn) btn.innerHTML = `<i class="fas fa-times-circle mr-1"></i> โหลดผิดพลาด`;
                showToast("พบปัญหาในการเชื่อมต่อเพื่อดาวน์โหลดรูป", "error");
            } finally {
                setTimeout(() => {
                    if (btn) {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    }
                }, 3000);
            }
        }

        // Initialize App
        initUIMode();
        loadPage(TARGET_URL);

    </script>
