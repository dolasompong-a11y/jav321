<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>JAV Gallery Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<script>try{const t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(_){}</script>
<style>
:root{--bg:#fff;--fg:#111;--mut:#767676;--sf:#efefef;--sf2:#e0e0e0;--red:#e60023;--bd:#0000001a;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bot:0px;color-scheme:light}
.dark{--bg:#121212;--fg:#f1f1f1;--mut:#a3a3a3;--sf:#2a2a2a;--sf2:#3a3a3a;--bd:#ffffff22;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:400 14px/1.4 Kanit,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #0a6cff;outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.on{fill:var(--red);stroke:var(--red)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--sf)}.ib.sm{width:32px;height:32px}.ib.sm .ic{width:16px;height:16px}
.grow{flex:1;min-width:0}.mut{color:var(--mut)}
.btn{height:40px;padding:0 16px;border-radius:20px;background:var(--sf);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.red{background:var(--red);color:#fff}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 12px 8px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px;font-weight:600;font-size:18px;color:var(--red)}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font:600 15px Kanit}
.tabs{display:flex;gap:4px}
.tab{height:44px;padding:0 16px;border-radius:24px;font-weight:600;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--fg);color:var(--bg)}.tab:not(.on):hover{background:var(--sf)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--sf);color:var(--mut)}
.search:focus-within{box-shadow:0 0 0 3px #0a6cff99}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--fg);font-size:16px}
#favbar{display:flex;gap:8px;padding:0 12px 8px;flex-wrap:wrap}
#favbar input,#favbar select{height:40px;border-radius:20px;border:0;background:var(--sf);padding:0 14px;min-width:0}
#favbar input{flex:1}
main{padding:4px 12px calc(var(--bot) + var(--sab) + 72px)}
.mas{position:relative}
.card{position:absolute;left:0;top:0;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.wrap{position:relative}
.thumb{display:block;width:100%;position:relative;border-radius:16px;overflow:hidden;background:var(--sf);cursor:zoom-in}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.sk{background:linear-gradient(90deg,var(--sf),var(--sf2),var(--sf));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.meta{display:flex;align-items:flex-start;gap:2px;padding:6px 2px 0 4px}
.meta .t{flex:1;font-size:13px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-top:4px}
.save{position:absolute;top:8px;right:8px;z-index:2;background:var(--red);color:#fff;border-radius:22px;padding:8px 14px;font-weight:600;font-size:13px}
.save.on{background:#111;color:#fff}
.save.rm{background:#000b;width:36px;height:36px;padding:0;display:grid;place-items:center}.save.rm .ic{width:16px;height:16px}
.tag{position:absolute;top:8px;left:8px;z-index:2;background:#0009;color:#fff;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:500}
.acts{position:absolute;right:8px;bottom:8px;z-index:2;display:flex;gap:6px}
.chip{width:40px;height:40px;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center}.chip .ic{width:18px;height:18px}
@media(hover:hover){.save:not(.on),.acts{opacity:0;transition:opacity .15s}.card:hover .save,.card:hover .acts{opacity:1}.card:hover .thumb::after{content:"";position:absolute;inset:0;background:#0005;pointer-events:none}}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:72px 16px;color:var(--mut)}
.empty .ic{width:48px;height:48px}.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.spin{width:32px;height:32px;margin:16px auto;border-radius:50%;border:3px solid var(--sf2);border-top-color:var(--red);animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(1turn)}}
.end{text-align:center;color:var(--mut);margin:16px}
/* bottom nav + floating */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(56px + var(--sab));padding-bottom:var(--sab);background:var(--bg);border-top:1px solid var(--bd);justify-content:space-around;align-items:center}
.bnav button{position:relative;width:64px;height:48px;display:grid;place-items:center;color:var(--mut)}.bnav .on{color:var(--fg)}
.badge{position:absolute;top:4px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
#totop{position:fixed;right:16px;bottom:calc(var(--bot) + var(--sab) + 16px);z-index:19;width:48px;height:48px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);box-shadow:0 2px 10px #0003;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
#totop.show{opacity:1;pointer-events:auto}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--bot) + var(--sab) + 24px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111;color:#fff;padding:12px 20px;border-radius:24px;font-weight:500;max-width:90vw;animation:fade .2s both;transition:opacity .25s}
.toast.warn{background:var(--red)}
@media(max-width:699px){:root{--bot:56px}.bnav{display:flex}.tabs,.logo span,.d-only{display:none}main{padding-inline:8px}}
/* layers */
.layer{position:fixed;inset:0;z-index:50;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.layer.open{visibility:visible;opacity:1}
.scrim{position:absolute;inset:0;background:#0008}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(360px,90vw);background:var(--bg);overflow-y:auto;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 16px);transform:translateX(100%);transition:transform .25s}
#menu.open .drawer{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.sec{margin-top:20px}.sec h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:500}
.seg{display:flex;background:var(--sf);border-radius:20px;padding:3px}.seg button{flex:1;height:36px;border-radius:18px;font-weight:600;color:var(--mut)}.seg .on{background:var(--bg);color:var(--fg)}
.row{display:flex;align-items:center;gap:12px;width:100%;height:48px;border-radius:12px;font-weight:500;padding:0 8px}.row:hover{background:var(--sf)}
#cur{display:block;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--sf);font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmr{display:flex;align-items:center;gap:4px;padding:6px 0;border-bottom:1px solid var(--bd)}
.bmr .grow{text-align:left}.bmr b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bmr small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec input{width:100%;height:44px;border-radius:12px;border:2px solid var(--sf2);background:none;padding:0 12px;font-size:14px}
.two{display:flex;gap:8px;margin-top:8px}.two .btn{flex:1}
#modal .panel{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);height:100dvh;transition:transform .2s}
@media(min-width:700px){#modal{display:grid;place-items:center;background:#0009}#modal .panel{position:relative;inset:auto;width:min(1100px,96vw);height:92dvh;border-radius:32px;overflow:hidden}}
.mh{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) 8px 8px 16px;border-bottom:1px solid var(--bd)}
.code{background:var(--sf);border-radius:12px;padding:4px 12px;font-weight:600;font-size:12px;color:var(--red);flex:none}
.mh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#m-drawer{padding:16px;max-height:45dvh;overflow:auto;background:var(--sf)}
#m-drawer h2{margin:0 0 12px;font-size:16px;line-height:1.5}
#m-drawer dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0}
#m-drawer dt{font-size:12px;color:var(--mut)}#m-drawer dd{margin:4px 0 0;font-weight:500}
#m-drawer .c{display:inline-block;background:var(--bg);padding:6px 12px;border-radius:16px;font-size:12px;margin:0 6px 6px 0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(var(--sab) + 12px)}
#m-note{text-align:center;color:var(--mut);font-size:12px;margin:0 0 12px}
#viewer{background:#000;touch-action:none;color:#fff;z-index:60}
#vimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;transition:opacity .2s}
.vtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 12px) 12px 24px;background:linear-gradient(#000a,transparent)}
.pill{background:#0009;color:#fff;border-radius:22px;height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.pill select{background:none;border:0;color:#fff;font-weight:600}.pill select option{color:#000}.pill button{color:#fff;display:flex}
.vnav{position:absolute;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:50%;background:#0006;color:#fff;display:grid;place-items:center}
.vnav.l{left:8px}.vnav.r{right:8px}
.vsrc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 20px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app">
  <header class="top">
    <button class="logo" id="logo" aria-label="หน้าแรก"><i>J</i><span>JAV Hub</span></button>
    <nav class="tabs" aria-label="หมวด">

    <form class="search" id="sf" role="search">

    <button class="ib d-only" data-menu aria-label="เมนู"><svg class="ic"><use href="#i-menu"/></svg></button>

  <div id="favbar" hidden>
    <input id="fq" placeholder="ค้นหาในโปรด" aria-label="ค้นหาในโปรด">

    <div class="sec"><button class="row" id="b-theme"></button><button class="row" id="b-home"><svg class="ic"><use href="#i-home"/></svg>โหลดหน้าแรก JAVDB ใหม่</button></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ROOT='https://javdb.com/',IMG=/\.(?:jpe?g|png|webp|gif|avif)(?:[?#]|$)/i,BLOCK=/Just a moment\.\.\.|cf-browser-verification|Attention Required/i;
const S={tab:'home',cur:ROOT,movie:null,imgs:[],cover:true,grid:'medium',fav:[],bm:[],gas:'',tok:0,mtok:0};
let L={url:ROOT,base:ROOT,page:0,next:true,busy:false,seen:new Set(),items:[]},favVer=0,bmVer=0,Q=[];
const tabPos={};
const raw=k=>{try{return localStorage.getItem(k)}catch(_){return null}},setRaw=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}},rmRaw=k=>{try{localStorage.removeItem(k)}catch(_){}};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abs=(v,b=ROOT)=>{try{const u=new URL(v,b);return /^https?:$/.test(u.protocol)?u.href:''}catch(_){return ''}};
const isJ=u=>{try{const h=new URL(u).hostname;return h==='javdb.com'||h.endsWith('.javdb.com')}catch(_){return false}};
const noHash=u=>{try{const x=new URL(u);x.hash='';return x.href}catch(_){return u}};
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const clean=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object'&&!String(x.url||'').toLowerCase().includes('jav321'));
const ts=v=>Number(v)||Date.parse(v)||0;
const near=()=>innerHeight+scrollY>document.documentElement.scrollHeight-1400;
function toast(m,t=''){const d=el(`<div class="toast ${t}">${esc(m)}</div>`);$('#toasts').append(d);setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),250)},2800)}

/* ---------- JS masonry (columns assigned once, no jumping) ---------- */
function Masonry(root,target){
  const m={items:[],cols:0,w:0};let raf=0;
  m.layout=full=>{
    const w=root.clientWidth;if(!w)return;
    const gap=innerWidth<700?8:16,n=Math.max(1,Math.floor((w+gap)/(target()+gap))),cw=(w-(n-1)*gap)/n;
    if(full||n!==m.cols){m.cols=n;m.items.forEach(i=>i.c=-1)}
    const h=Array(n).fill(0);
    for(const it of m.items){
      if(it.c<0||it.c>=n)it.c=h.indexOf(Math.min(...h));
      it.el.style.width=cw+'px';it.y=h[it.c];
      it.el.style.transform=`translate(${it.c*(cw+gap)}px,${it.y}px)`;
      h[it.c]+=it.el.offsetHeight+gap;
    }
    root.style.height=Math.max(0,...h)+'px';
  };
  m.soon=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>m.layout())};
  m.add=els=>{for(const e of els){root.append(e);m.items.push({el:e,c:-1,y:0})}m.layout()};
  m.clear=()=>{m.items=[];root.innerHTML='';root.style.height='0'};
  new ResizeObserver(()=>{const w=root.clientWidth;if(w!==m.w){m.w=w;m.soon()}}).observe(root);
  return m;
}

/* ---------- fetch (cache + dedupe + parallel proxies) ---------- */
const cache=new Map(),inflight=new Map();
const timed=async(u,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}};
const gasUrl=p=>{const u=new URL(S.gas);for(const k in p)u.searchParams.set(k,p[k]);return u.href};
function fetchHtml(url){
  const t=abs(url);if(!t||!isJ(t))return Promise.reject(Error('อนุญาตเฉพาะโดเมน JAVDB'));
  const target=noHash(t);
  if(cache.has(target))return Promise.resolve(cache.get(target));
  if(inflight.has(target))return inflight.get(target);
  const p=(async()=>{
    if(S.gas){try{const d=JSON.parse(await timed(gasUrl({action:'fetchHtml',targetUrl:target}),12000));if(d&&d.success&&typeof d.html==='string'&&d.html.length>300&&!BLOCK.test(d.html))return d.html}catch(_){}}
    const e=encodeURIComponent(target);
    const tries=[`https://api.allorigins.win/raw?url=${e}`,`https://corsproxy.io/?url=${e}`,`https://api.allorigins.win/get?url=${e}`].map(async u=>{
      let b=await timed(u,10000);
      if(u.includes('/get?'))try{b=JSON.parse(b).contents||''}catch(_){}
      if(b.length<500||BLOCK.test(b))throw 0;return b});
    try{return await Promise.any(tries)}catch(_){throw Error('ดึงข้อมูลไม่ได้ (อาจติดระบบกันบอต) ลองเชื่อมต่อ GAS หรือเปิดเว็บต้นทาง')}
  })().then(h=>{cache.set(target,h);if(cache.size>40)cache.delete(cache.keys().next().value);return h}).finally(()=>inflight.delete(target));
  inflight.set(target,p);return p;
}
const parse=h=>new DOMParser().parseFromString(h,'text/html');
const imgSrc=i=>i?(i.getAttribute('data-original')||i.getAttribute('data-src')||i.getAttribute('data-lazy-src')||i.getAttribute('src')||''):'';
const bestImg=(img,a,b)=>{const h=a?.getAttribute('href')||'';return abs(IMG.test(h)?h:imgSrc(img),b)};
function parseList(doc,page){
  const out=[],seen=new Set();
  let links=[...doc.querySelectorAll('.movie-list .item a[href*="/v/"],.item a[href*="/v/"],a[href^="/v/"]')];
  if(!links.length)links=[...doc.querySelectorAll('a[href*="/v/"]')];
  for(const a of links){
    const href=abs(a.getAttribute('href'),page);if(!href||!isJ(href))continue;
    const m=new URL(href).pathname.match(/^\/v\/([^/]+)/);if(!m||seen.has(m[1]))continue;
    const card=a.closest('.item,.movie-list-item')||a,img=card.querySelector('.cover img,img')||a.querySelector('img');
    const thumb=bestImg(img,a,page)||bestImg(img,img?.closest('a'),page);if(!thumb)continue;
    const code=(card.querySelector('.video-title strong')?.textContent||'').trim();
    const title=(card.querySelector('.video-title,.title,.movie-title,h2,h3')?.textContent||a.getAttribute('title')||img?.alt||'').replace(/\s+/g,' ').trim()||code||m[1];
    seen.add(m[1]);out.push({id:m[1],code:code||m[1],title,thumb,url:href});
  }

/* ---------- favorites / bookmarks / GAS sync (queue + retry + merge) ---------- */

const qkey=p=>p.action==='syncBookmark'?'B|'+p.url:fk(p);

let qBusy=false;
function enqueue(p){if(!S.gas)return;Q.push(p);ls.set('gas_q',Q);flush()}
async function flush(){
  if(qBusy||!S.gas||!Q.length)return;qBusy=true;
  try{while(Q.length){await fetch(gasUrl(Q[0]),{mode:'no-cors'});Q.shift();ls.set('gas_q',Q)}}catch(_){setTimeout(flush,15000)}
  qBusy=false;
}

function merge(remote,local,action,key,mk){
  const m=new Map(remote.map(x=>[key(x),x])),lm=new Map(local.map(x=>[key(x),x]));
  if(!remote.length)for(const [k,v] of lm){m.set(k,v);enqueue(mk(v,'add'))}
  for(const q of Q)if(q.action===action){const k=qkey(q);if(q.status==='remove')m.delete(k);else if(lm.has(k))m.set(k,lm.get(k))}
  return [...m.values()];
}
async function pull(){
  if(!S.gas)return false;const fv=favVer,bv=bmVer;

    const [a,b]=await Promise.all(['getFavorites','getBookmarks'].map(async x=>(await fetch(gasUrl({action:x}))).json()));
    if(a?.success&&Array.isArray(a.favorites)&&fv===favVer){
      const r=clean(a.favorites).map(f=>({...f,isSnapshot:String(f.isSnapshot)==='true',snapshotIndex:+f.snapshotIndex||0,timestamp:ts(f.timestamp)}));
      S.fav=merge(r,S.fav,'sync',fk,favParams);ls.set('jav_favorites',S.fav);badge();syncUI();if(S.tab==='fav')renderFavs();

      S.bm=merge(r,S.bm,'syncBookmark',x=>'B|'+x.url,bmParams);ls.set('jav_bookmarks',S.bm);renderBm();syncUI();

  $('#m-drawer').innerHTML=`<h2>${esc(title)}</h2><dl><div><dt>รหัส</dt><dd>${esc(code)}</dd></div><div><dt>วันที่ออก</dt><dd>${esc(date||'—')}</dd></div><div><dt>ผู้กำกับ</dt><dd>${ch(g.directors)}</dd></div><div><dt>ค่าย</dt><dd>${ch(g.makers)}</dd></div><div><dt>ซีรีส์</dt><dd>${ch(g.series)}</dd></div><div><dt>นักแสดง</dt><dd>${ch(g.actors)}</dd></div><div style="grid-column:1/-1"><dt>แท็ก</dt><dd>${ch(g.tags)}</dd></div></dl><p><a class="btn red" href="${esc(S.movie.url)}" target="_blank" rel="noopener noreferrer">${ic('ext')} เปิดหน้าต้นฉบับ</a></p>`;
}
$('#m-drawer').onclick=e=>{const a=e.target.closest('[data-u]');if(a){e.preventDefault();closeAll(()=>openList(a.dataset.u))}};
$('#m-info').onclick=()=>{$('#m-drawer').hidden=!$('#m-drawer').hidden};
$('#bm-modal').onclick=toggleBm;$('#bm-cur').onclick=toggleBm;
async function openMovie(url,it,hash=''){
  const tok=++S.mtok,pu=abs(url)||ROOT,id=it.id||new URL(pu).pathname.split('/')[2]||'JAVDB';
  openLayer('modal');setActive(pu);
  S.movie={...it,id,url:pu};S.cover=Boolean(it.thumb);S.imgs=it.thumb?[it.thumb]:[];
  $('#m-code').textContent=it.code||id;$('#m-short').textContent=it.title||id;
  $('#m-drawer').hidden=true;$('#m-scroll').scrollTop=0;$('#m-note').textContent='กำลังโหลดภาพ...';
  renderScenes();
  try{
    const doc=parse(await fetchHtml(pu));if(tok!==S.mtok)return;
    const T=s=>(doc.querySelector(s)?.textContent||'').replace(/\s+/g,' ').trim();
    const title=T('h2.title .current-title,h2.title strong,h2.title,.movie-panel-info h2,h1.title,.video-title')||doc.querySelector('meta[property="og:title"]')?.content||it.title||id;
    const code=T('h2.title strong,.video-title strong,.movie-panel-info .value')||it.code||id;
    let cover=it.thumb||'';
    const ci=doc.querySelector('img.video-cover,.video-cover img,.column-video-cover img,a.bigImage img,.movie-panel-info .cover img');
    if(ci)cover=bestImg(ci,ci.closest('a'),pu)||cover;
    if(!cover)cover=abs(doc.querySelector('meta[property="og:image"],meta[name="twitter:image"]')?.content||'',pu);
    S.movie={...S.movie,code,title,thumb:cover||''};
    $('#m-code').textContent=code;$('#m-short').textContent=title;
    fillDrawer(title,code,metaText(doc,['released date','release date','發行日期','发行日期','date']),detailGroups(doc,pu));
    const imgs=cover?[cover]:[];
    for(const s of sceneImages(doc,pu,cover))if(!imgs.includes(s))imgs.push(s);
    S.imgs=imgs;S.cover=Boolean(cover);renderScenes();
    const m=String(hash||'').match(/gallery-(\d+)/i);
    if(m&&S.imgs.length>1){
      const idx=Math.max(0,Math.min(S.cover?+m[1]:+m[1]-1,S.imgs.length-1));
      setTimeout(()=>$('#m-scroll').scrollTo({top:Math.max(0,(mm.items[idx]?.y||0)-8),behavior:'smooth'}),300);
    }
  }catch(e){
    if(tok!==S.mtok)return;
    $('#m-note').textContent='โหลดรายละเอียดไม่สำเร็จ: '+e.message;
  }
}
function sceneImages(doc,base,cover){
  const out=[],seen=new Set(),cu=abs(cover||'',base);
  const add=(r,prev)=>{
    const u=abs(r,base);
    if(!u||u===cu||/(?:logo|avatar|favicon|sprite|banner|icon)(?:[._/?-]|$)/i.test(u))return;
    if(!IMG.test(u)&&!prev)return;
    if(!seen.has(u)){seen.add(u);out.push(u)}
  };
  for(const g of doc.querySelectorAll('.preview-images')){
    const tiles=[...g.querySelectorAll('a.tile-item[href]')];
    if(tiles.length){for(const t of tiles){const h=t.getAttribute('href')||'';if(IMG.test(h))add(h);else add(imgSrc(t.querySelector('img')),true)}continue}
    const ls2=[...g.querySelectorAll('a[href]')].filter(a=>IMG.test(a.getAttribute('href')||''));
    if(ls2.length)ls2.forEach(a=>add(a.getAttribute('href')));else g.querySelectorAll('img').forEach(i=>add(imgSrc(i),true));
  }
  return out;
}
/* drag down on the modal to close */
(()=>{
  const sc=$('#m-scroll'),p=$('#modal .panel');let y0=0,dy=0,on=false;
  sc.addEventListener('touchstart',e=>{on=sc.scrollTop<=0&&e.touches.length===1;y0=e.touches[0].clientY;dy=0},{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(!on)return;dy=e.touches[0].clientY-y0;
    if(dy>0&&sc.scrollTop<=0){p.style.transition='none';p.style.transform=`translateY(${dy*.6}px)`}else{dy=0;p.style.transform=''}
  },{passive:true});
  sc.addEventListener('touchend',()=>{p.style.transition='';p.style.transform='';if(on&&dy>140)back();on=false},{passive:true});
})();

/* ---------- full-screen viewer: swipe, pinch, double-tap, wheel ---------- */
const V={a:[],i:0,s:1,x:0,y:0,p:new Map(),t:null,tap:0},vimg=$('#vimg'),vw=$('#viewer');
const vT=()=>{vimg.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.s})`};
function openViewer(a,i){if(!a.length)return;V.a=a;V.i=Math.max(0,Math.min(i||0,a.length-1));openLayer('viewer');vShow()}
function vShow(){
  const n=V.a.length;V.i=(V.i%n+n)%n;V.s=1;V.x=V.y=0;vT();
  vimg.style.opacity=.2;vimg.onload=vimg.onerror=()=>{vimg.style.opacity=1};vimg.src=V.a[V.i];
  $('#v-info').textContent=`${V.i+1} / ${n}`;$('#v-src').href=V.a[V.i];
  $('#v-prev').hidden=$('#v-next').hidden=n<2;
  if(n>1)new Image().src=V.a[(V.i+1)%n];
}
function vStep(d,keep){V.i+=d;vShow();if(V.t&&!keep){slideStop();slideStart()}}
function slideStart(){if(V.t||!V.a.length)return;$('#v-play').innerHTML=ic('pause');V.t=setInterval(()=>vStep(1,true),+$('#v-speed').value||3000)}
function slideStop(){$('#v-play').innerHTML=ic('play');if(V.t){clearInterval(V.t);V.t=null}}
$('#v-play').onclick=()=>V.t?slideStop():slideStart();
$('#v-speed').onchange=()=>{if(V.t){slideStop();slideStart()}};
$('#v-prev').onclick=()=>vStep(-1);$('#v-next').onclick=()=>vStep(1);
const vDist=()=>{const [a,b]=[...V.p.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
vw.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,select,a'))return;
  vw.setPointerCapture(e.pointerId);
  if(!V.p.size){V.moved=false;V.pinch=false}
  V.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  V.sx=e.clientX;V.sy=e.clientY;V.ox=V.x;V.oy=V.y;
  if(V.p.size===2){V.d0=vDist();V.s0=V.s;V.pinch=true}
});
vw.addEventListener('pointermove',e=>{
  if(!V.p.has(e.pointerId))return;
  V.p.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(V.p.size===2){V.s=Math.min(5,Math.max(1,V.s0*vDist()/V.d0));if(V.s===1)V.x=V.y=0;vT()}
  else if(V.s>1&&!V.pinch){V.x=V.ox+e.clientX-V.sx;V.y=V.oy+e.clientY-V.sy;vT()}
  if(Math.abs(e.clientX-V.sx)+Math.abs(e.clientY-V.sy)>8)V.moved=true;
});
vw.addEventListener('pointerup',e=>{
  if(!V.p.has(e.pointerId))return;
  const last=V.p.size===1;V.p.delete(e.pointerId);
  if(!last||V.pinch)return;
  const dx=e.clientX-V.sx,dy=e.clientY-V.sy;
  if(!V.moved){const n=Date.now();if(n-V.tap<300){V.s=V.s>1?1:2.5;V.x=V.y=0;vT();V.tap=0}else V.tap=n;return}
  if(V.s>1)return;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))vStep(dx<0?1:-1);
  else if(dy>110)back();
});
vw.addEventListener('pointercancel',e=>V.p.delete(e.pointerId));
vw.addEventListener('wheel',e=>{e.preventDefault();V.s=Math.min(5,Math.max(1,V.s*(e.deltaY<0?1.15:.87)));if(V.s===1)V.x=V.y=0;vT()},{passive:false});
addEventListener('keydown',e=>{
  const top=layers[layers.length-1];
  if(e.key==='Escape'&&top)return back();
  if(top==='viewer'){if(e.key==='ArrowRight')vStep(1);else if(e.key==='ArrowLeft')vStep(-1);else if(e.key===' '&&!e.target.closest('select')){e.preventDefault();V.t?slideStop():slideStart()}}
});

function setGrid(g){S.grid=g;setRaw('grid',g);$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.g===g));main.layout(true)}

function themeUI(){
  const d=document.documentElement.classList.contains('dark');
  $('#b-theme').innerHTML=ic(d?'sun':'moon')+(d?'สลับเป็นโหมดสว่าง':'สลับเป็นโหมดมืด');
  document.querySelector('meta[name=theme-color]').content=d?'#121212':'#ffffff';
}

$$('[data-tab]').forEach(b=>b.onclick=()=>{

});
$('#sf').onsubmit=e=>{
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;$('#q').blur();
  let u;
  if(/^https?:\/\//i.test(q)||/javdb\.com/i.test(q)){u=abs(/^https?:/i.test(q)?q:'https://'+q);if(!u||!isJ(u))return toast('ลิงก์ JAVDB ไม่ถูกต้อง','warn')}
  else{const x=new URL('/search',ROOT);x.searchParams.set('q',q);x.searchParams.set('f','all');u=x.href}
  openList(u);
};
$('#gas-save').onclick=async()=>{
  const u=$('#gas').value.trim();
  if(!/^https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(u))return toast('URL ไม่ถูกต้อง','warn');
  S.gas=u;setRaw('gas_url',u);const ok=await pull();flush();
  toast(ok?'เชื่อมต่อสำเร็จ':'บันทึก URL แล้ว แต่ซิงค์ไม่สำเร็จ',ok?'ok':'warn');
};
$('#gas-clear').onclick=()=>{S.gas='';rmRaw('gas_url');$('#gas').value='';toast('ยกเลิกเชื่อมต่อแล้ว','ok')};

(function init(){
  S.fav=clean(ls.get('jav_favorites',[]));
  S.fav.forEach(f=>{if(!f.isSnapshot&&typeof f.url==='string')f.url=noHash(f.url)});
  S.bm=clean(ls.get('jav_bookmarks',[]));Q=ls.get('gas_q',[]);

  setGrid(['small','medium','large'].includes(raw('grid'))?raw('grid'):'medium');

  history.replaceState({n:0,u:ROOT},'');
  openList(ROOT,{push:false});
  if(S.gas){pull();flush()}
})();
